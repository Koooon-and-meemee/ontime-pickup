@font-face { font-family:"Asta"; src:url("file:///Users/park-sangwon/Desktop/2026F/HMG.AppContest/server/static/fonts/AstaSans.ttf"); font-weight:300 800; }
html,body { margin:0; width:1280px; height:720px; overflow:hidden; background:#0E1A2B; font-family:"Asta",sans-serif; }
.scene { display:none; position:absolute; inset:0; }
.scene.on { display:block; }
svg { width:1280px; height:720px; display:block; }
text { font-family:"Asta",sans-serif; }
/* 공통 애니메이션 */
@keyframes pop { 0%{scale:0;opacity:0} 60%{scale:1.15;opacity:1} 100%{scale:1;opacity:1} }
@keyframes fadeUp { from{opacity:0;translate:0 24px} to{opacity:1;translate:0 0} }
@keyframes road { from{transform:translateX(0)} to{transform:translateX(-160px)} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.15} }
@keyframes steam { 0%{opacity:0;transform:translateY(8px)} 40%{opacity:.9} 100%{opacity:0;transform:translateY(-26px)} }
@keyframes glow { 0%,100%{opacity:.0} 50%{opacity:.85} }
@keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }
@keyframes slideR { from{transform:translateX(0)} to{transform:translateX(330px)} }
@keyframes ringDown { from{stroke-dasharray:226 289} to{stroke-dasharray:150 289} }
@keyframes hand { 0%{transform:translateX(70px)} 100%{transform:translateX(0)} }
.pop { transform-box:fill-box; transform-origin:50% 100%; animation:pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.fade { animation:fadeUp .6s ease-out both; }
.d1{animation-delay:.6s}.d2{animation-delay:1.2s}.d3{animation-delay:1.9s}.d4{animation-delay:2.6s}.d5{animation-delay:3.3s}
.roadline { animation:road .6s linear infinite; }
.wheel { transform-box:fill-box; transform-origin:center; animation:spin .5s linear infinite; }
.bob { animation:bob .5s ease-in-out infinite; }
.blink { animation:blink .7s steps(1) infinite; }
.steam path { animation:steam 1.6s ease-out infinite; }
.steam path:nth-child(2){animation-delay:.5s}.steam path:nth-child(3){animation-delay:1s}
.glow { animation:glow 1s ease-in-out 3 both; animation-delay:.5s; }
.shake { transform-box:fill-box; transform-origin:50% 100%; animation:shake .35s ease-in-out 3; }
</style></head>
